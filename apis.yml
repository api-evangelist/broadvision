name: Broadvision
description: >-
  BroadVision spans two chapters of Dr. Pehong Chen's technology work. BroadVision,
  Inc. (NASDAQ: BVSN), founded in 1993 and backed by Mayfield, was a pioneer of
  e-commerce and enterprise self-service portal software and later the Vmoso
  enterprise collaboration platform; the operating company was acquired by ESW
  Capital in 2020. The broadvision.com domain is now home to BroadVision Group
  (BVG), a US-based private asset management firm formed in 2006 that funds,
  incubates, and operates ventures across artificial intelligence, cleantech,
  fintech, healthtech, biotech, medtech, semiconductors, and cloud/big-data. The
  company does not currently publish a public developer API, SDK, or
  documentation surface.
